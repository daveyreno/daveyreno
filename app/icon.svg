<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The site's own identity, reduced to what survives at 16px: the dye plume as
    a single lit orb on the near-black ground. A monogram would be unreadable at
    tab size; a bright core against #060608 is legible and unmistakable.
  -->
  <defs>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#FFE2B0"/>
      <stop offset="28%"  stop-color="#F97316"/>
      <stop offset="62%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#0BA6C9"/>
    </radialGradient>
    <radialGradient id="glow" cx="42%" cy="38%" r="50%">
      <stop offset="0%"   stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0BA6C9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="#060608"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="15" fill="url(#core)"/>
</svg>
